name: Desktop

# Builds the desktop app (M12) on each operating system's own runner and uploads the installers:
# Windows NSIS (x64), macOS dmg (universal), Linux AppImage (x64). Unsigned unless signing
# certificates are supplied as repository secrets (see docs/DESKTOP.txt). Run by hand or on a tag.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package
        run: pnpm --filter @clearly/desktop package
        env:
          CLEARLY_SERVER_URL: ${{ vars.CLEARLY_SERVER_URL }}
          CLEARLY_DOWNLOAD_URL: ${{ vars.CLEARLY_DOWNLOAD_URL }}
          # Signing only when certificates are configured; never committed.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: clearly-desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
          if-no-files-found: error
